    const next = { ...baseState(), ...rawState };
    next.ownerEmail = normalizeEmail(next.ownerEmail);
    next.scorerEmails = Array.isArray(next.scorerEmails)

  function buildTournamentMeta(name, ownerEmail, scorerEmails = [], inviteEmails = [], gameData = {}) {
    const cleanName = String(name || '').trim() || 'Meu torneio';
    const owner = normalizeEmail(ownerEmail);
    const members = Array.isArray(scorerEmails) ? scorerEmails.map(normalizeEmail).filter(Boolean) : [];
    const invited = Array.isArray(inviteEmails) ? inviteEmails.map(normalizeEmail).filter(Boolean) : [];
    return {
      id: crypto.randomUUID ? crypto.randomUUID() : `tournament-${Date.now()}-${Math.random().toString(16).slice(2)}`,
      name: cleanName,
      owner_email: owner,
      scorer_emails: [...new Set(members.filter(email => email !== owner))],
      invite_emails: [...new Set(invited.filter(email => email !== owner && !members.includes(email)))],
      game_data: normalizeStateShape({ ...baseState(), ...gameData, ownerEmail: owner, scorerEmails: members.filter(email => email !== owner), inviteEmails: invited.filter(email => email !== owner && !members.includes(email)) })
    };
  }

    if (!tournamentList.length) {

    container.innerHTML = tournamentList.map(tournament => {
      const owner = normalizeEmail(tournament.owner_email || '');

          <span class="mini muted">${owner === currentEmail ? translations[currentLanguage].responsible : translations[currentLanguage].operator}</span>

  function isAuthorizedAdmin(user) {
    if (!user) return false;
    const currentEmail = normalizeEmail(user.email);

    const ownerEmail = normalizeEmail(state.ownerEmail);
    const scorerEmails = Array.isArray(state.scorerEmails) ? state.scorerEmails.map(normalizeEmail).filter(Boolean) : [];

    if (!ownerEmail && !scorerEmails.length) {

      return true;

    return currentEmail === ownerEmail || scorerEmails.includes(currentEmail);

  async function checkUser() {

    if (user) {

    isAdmin = isAuthorizedAdmin(user);
    if (isAdmin) {

        el("btnLoginAction").classList.remove("logout-btn");
        if (el("readOnlyMsg")) el("readOnlyMsg").classList.remove("hidden");
    }

    if (user && !state.ownerEmail) {
      state.ownerEmail = normalizeEmail(user.email);
    }
    if (user && state.ownerEmail && (state.ownerEmail === normalizeEmail(user.email) || state.scorerEmails.includes(normalizeEmail(user.email)))) {
      await loadTournamentsForCurrentUser();
      if (selectedTournamentId) await loadStateFromCloud();

  async function loadTournamentsForCurrentUser() {
    const currentEmail = getSessionUserEmail();
    if (!currentEmail) {
      tournamentList = [];
      renderTournamentManager();
      return;
    }

    const { data, error } = await supabase.from('tournaments').select('*').order('updated_at', { ascending: false });
    if (error) {
      if (error.code === '42P01') {
        reportCloudError('A tabela de torneios ainda nÃ£o foi criada. Use o SQL do README para criar o schema multi-torneio.', error);
      } else {
        reportCloudError('NÃ£o foi possÃ­vel carregar a lista de torneios.', error);
      }
      return;
    }

    tournamentList = (data || [])
      .filter(tournament => {
        const owner = normalizeEmail(tournament.owner_email || '');
        const scorers = Array.isArray(tournament.scorer_emails) ? tournament.scorer_emails.map(normalizeEmail).filter(Boolean) : [];
        return owner === currentEmail || scorers.includes(currentEmail);
      })
      .map(tournament => ({
        ...tournament,
        name: String(tournament.name || '').trim() || 'Meu torneio',
        owner_email: normalizeEmail(tournament.owner_email || currentEmail),
        scorer_emails: Array.isArray(tournament.scorer_emails) ? [...new Set(tournament.scorer_emails.map(normalizeEmail).filter(Boolean))] : []
      }));

    if (!tournamentList.length) {
      const fallback = buildTournamentMeta('Meu torneio', currentEmail, [], state);
      const { data: inserted, error: insertError } = await supabase.from('tournaments').insert({
        id: fallback.id,
        name: fallback.name,
        owner_email: fallback.owner_email,
        scorer_emails: fallback.scorer_emails,
        game_data: fallback.game_data,
        updated_at: new Date().toISOString()
      })
      .select()
      .single();

      if (!insertError && inserted) {
        tournamentList = [inserted];
      }
    }

    const storedSelection = localStorage.getItem(STORAGE_TOURNAMENT_KEY);
    const validSelection = tournamentList.some(item => item.id === storedSelection) ? storedSelection : null;
    const firstTournament = tournamentList.length ? tournamentList[0] : null;
    selectedTournamentId = validSelection || (firstTournament ? firstTournament.id : null);
    if (selectedTournamentId) {
      localStorage.setItem(STORAGE_TOURNAMENT_KEY, selectedTournamentId);
      selectedTournamentMeta = tournamentList.find(item => item.id === selectedTournamentId) || null;
    } else {
      localStorage.removeItem(STORAGE_TOURNAMENT_KEY);
      selectedTournamentMeta = null;
    }

    renderTournamentManager();
    renderPublicTournaments();
  }

  // --- SINCRONIZAÃ‡ÃƒO (REALTIME) ---
  async function saveStateToCloud() {
    if (!isAdmin || !selectedTournamentId) return;
    const visibleSection = document.querySelector('main > section:not(.hidden)');
    const visibleStep = document.querySelector('#setup > div[id]:not(.hidden)');
    state = normalizeStateShape({
      ...state,
      uiSection: visibleSection ? visibleSection.id : state.uiSection,
      uiStep: visibleStep ? visibleStep.id : state.uiStep,
      ownerEmail: normalizeEmail(state.ownerEmail || getSessionUserEmail()),
      scorerEmails: Array.isArray(state.scorerEmails) ? state.scorerEmails.map(normalizeEmail).filter(Boolean) : [],
      inviteEmails: Array.isArray(state.inviteEmails) ? state.inviteEmails.map(normalizeEmail).filter(Boolean) : []
    });

    const currentTournament = tournamentList.find(item => item.id === selectedTournamentId) || selectedTournamentMeta;
    const payload = {
      id: selectedTournamentId,
      name: currentTournament ? currentTournament.name : 'Meu torneio',
      owner_email: normalizeEmail(currentTournament && currentTournament.owner_email ? currentTournament.owner_email : (state.ownerEmail || getSessionUserEmail())),
      scorer_emails: Array.isArray(currentTournament && currentTournament.scorer_emails) ? currentTournament.scorer_emails.map(normalizeEmail).filter(Boolean) : state.scorerEmails,
      game_data: state,
      updated_at: new Date().toISOString()
    };

    const { error } = await supabase.from('tournaments').upsert(payload, { onConflict: 'id' });
    if (error) reportCloudError('NÃ£o foi possÃ­vel salvar o estado do torneio.', error);
  }

  async function loadStateFromCloud() {
    if (!selectedTournamentId) return;
    const { data, error } = await supabase.from('tournaments').select('*').eq('id', selectedTournamentId).single();
    if (error && error.code !== 'PGRST116') {
        reportCloudError('NÃ£o foi possÃ­vel carregar o estado do torneio.', error);
        return;
    }
    if (data && data.game_data && Object.keys(data.game_data).length > 0) {
        selectedTournamentMeta = data;
        state = normalizeStateShape({
          ...baseState(),
          ...data.game_data,
          ownerEmail: data.owner_email || (data.game_data && data.game_data.ownerEmail) || state.ownerEmail,
          scorerEmails: Array.isArray(data.scorer_emails) ? data.scorer_emails : (data.game_data && Array.isArray(data.game_data.scorerEmails) ? data.game_data.scorerEmails : []),
          inviteEmails: Array.isArray(data.game_data && data.game_data.inviteEmails) ? data.game_data.inviteEmails : []
        });
        if (state.ownerEmail && state.scorerEmails.includes(state.ownerEmail)) {
          state.scorerEmails = state.scorerEmails.filter(email => email !== state.ownerEmail);
        }
        refreshUI();
    }
  }

  function reportCloudError(message, error) {
    console.error(message, error);
    const status = el("cloudStatus");
    status.textContent = `${message} Verifique a configuraÃ§Ã£o e as permissÃµes do Supabase.`;
    status.classList.remove("hidden");
    setTimeout(() => status.classList.add("hidden"), 8000);
  }

  supabase.channel('public:tournaments')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tournaments' }, payload => {
        if (payload.new && payload.new.id === selectedTournamentId) {
            selectedTournamentMeta = payload.new;
            state = normalizeStateShape({
              ...baseState(),
              ...payload.new.game_data,
              ownerEmail: payload.new.owner_email || (payload.new.game_data && payload.new.game_data.ownerEmail) || state.ownerEmail,
              scorerEmails: Array.isArray(payload.new.scorer_emails) ? payload.new.scorer_emails : (payload.new.game_data && Array.isArray(payload.new.game_data.scorerEmails) ? payload.new.game_data.scorerEmails : []),
              inviteEmails: Array.isArray(payload.new.game_data && payload.new.game_data.inviteEmails) ? payload.new.game_data.inviteEmails : []
            });
            refreshUI();
        }
        if (payload.new) {
          loadTournamentsForCurrentUser();
        }
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'tournaments' }, payload => {
        if (payload.new) {
          loadTournamentsForCurrentUser();
        }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'tournaments' }, payload => {
        if (payload.old && payload.old.id === selectedTournamentId) {
          selectedTournamentId = null;
          localStorage.removeItem(STORAGE_TOURNAMENT_KEY);
          state = baseState();
        }
        loadTournamentsForCurrentUser();
    })
    .subscribe((status, error) => {
        if (error || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            reportCloudError('A sincronizaÃ§Ã£o em tempo real do torneio estÃ¡ indisponÃ­vel.', error || status);
        }
    });

  // --- REGRAS DE UI ---
  function refreshUI() {
    document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
    const section = el(state.uiSection) || el('setup');
    section.classList.remove('hidden');

    if (state.uiSection === 'setup') {
        document.querySelectorAll('#setup > div[id]').forEach(d => d.classList.add('hidden'));
        const step = el(state.uiStep) || el('stepParams');
        step.classList.remove('hidden');

        if(state.numPlayers) el('numPlayers').value = state.numPlayers;
        if(state.numTeams) el('numTeams').value = state.numTeams;
        if(state.numRounds) el('numRounds').value = state.numRounds;

        if(state.uiStep === 'stepPlayers') renderPlayersForm();
        if(state.uiStep === 'stepTeams') renderTeamsForm();
        if(state.uiStep === 'stepTeamPreview') renderTeamPreview();
    }

    if (state.uiSection === 'matches') {
        atualizarClassificacao();
        renderAgenda();
        renderCurrentMatch();
    } else if (state.uiSection === 'finals') {
        renderFinalMatch();
    } else if (state.uiSection === 'podium') {

  }

    state.numPlayers = p; state.numTeams = t; state.numRounds = r;

  el("toPreviewBtn").addEventListener("click", () => {
    state.teams = [];

  // --- LÃ“GICA DO JOGO (SORTEIO ORIGINAL RESTAURADO) ---
  function distribuirPorSomaEquilibrada() {
    // 1. Ordena os jogadores do melhor para o pior
    const sortedPlayers = [...state.players].sort((a, b) => b.skill - a.skill);

    // 2. Limpa os times e o placar de habilidades
    state.teams.forEach(t => t.players = []);
    const teamSkillSums = new Array(state.numTeams).fill(0);

    // 3. Distribui sempre para o time que tem a menor soma de habilidades no momento
    sortedPlayers.forEach(player => {
        const minSumIndex = teamSkillSums.indexOf(Math.min(...teamSkillSums));
        state.teams[minSumIndex].players.push(player);
        teamSkillSums[minSumIndex] += player.skill;
    });
  }

  function gerarAgendaRoundRobinRespeitandoRodadas(){
    const n = state.numTeams; let list = Array.from({length:n}, (_,i)=> i);
    if(n % 2 === 1) list.push(-1);
    const m = list.length, roundsPerCycle = m - 1; let cycleRounds = [], arr = [...list];
    for(let r=0; r<roundsPerCycle; r++){
      const pairs = [];
      for(let i=0; i<m/2; i++){ if(arr[i]!==-1&&arr[m-1-i]!==-1) pairs.push({a:arr[i],b:arr[m-1-i]}); }
      cycleRounds.push(pairs); const fixed = arr[0], rest = arr.slice(1);
      rest.unshift(rest.pop()); arr = [fixed, ...rest];
    }
    const wantedRounds = state.numRounds; let rounds = [];
    for(let k=0; rounds.length<wantedRounds; k++){
      for(const rr of cycleRounds){ rounds.push(rr.map(p=>({...p}))); if(rounds.length>=wantedRounds) break; }
    }
    state.schedule = [];
    for(let r=0; r<rounds.length; r++){
      let order = 1; for(const p of rounds[r]){ state.schedule.push({ a:p.a, b:p.b, scoreA:null, scoreB:null, round:r+1, order:order++ }); }
    }
    state.currentIndex = 0;
  }

  function atualizarClassificacao(){
    state.teams.forEach(t => t.stats = {J:0, V:0, D:0, PF:0, PS:0});
    state.schedule.forEach(g => {
        if(g.scoreA == null || g.scoreB == null) return;
        const A = state.teams[g.a], B = state.teams[g.b];
        A.stats.J++; B.stats.J++; A.stats.PF += g.scoreA; A.stats.PS += g.scoreB; B.stats.PF += g.scoreB; B.stats.PS += g.scoreA;
        if(g.scoreA > g.scoreB) { A.stats.V++; B.stats.D++; } else if(g.scoreB > g.scoreA) { B.stats.V++; A.stats.D++; }
    });
    el("standingsTable").querySelector("tbody").innerHTML = state.teams.map(t => { const saldo = t.stats.PF - t.stats.PS; const perc = t.stats.J ? Math.round((t.stats.V / t.stats.J) * 100) : 0; return {...t, ...t.stats, saldo, perc}; })
      .sort((a,b) => (b.V - a.V) || (b.saldo - a.saldo) || (b.PF - a.PF))
      .map(r => `<tr><td style="color:${r.color}; font-weight:700;">${r.name}</td><td class="right">${r.J}</td><td class="right">${r.V}</td><td class="right">${r.PF}</td><td class="right">${r.PS}</td><td class="right">${r.saldo}</td><td class="right">${r.perc}%</td></tr>`).join("");
  }

  function buildPodium(){
    let podiumHTML = ''; const placed = new Set();
    const finalG=state.finals.find(x=>x.label==="Final"); const thirdG=state.finals.find(x=>x.label.includes("3Âº"));
    const getW = f => f&&f.scoreA!=null&&f.scoreB!=null?(f.scoreA>f.scoreB?state.teams[f.a]:state.teams[f.b]):null;
    const getL = f => f&&f.scoreA!=null&&f.scoreB!=null?(f.scoreA<f.scoreB?state.teams[f.a]:state.teams[f.b]):null;
    const champ=getW(finalG), vice=getL(finalG), third=getW(thirdG), fourth=getL(thirdG);

    if (champ) { podiumHTML += `<div class="status good"><b>ðŸ† 1Âº LUGAR:</b> ${champ.name}</div>`; placed.add(champ.name); }
    if (vice) { podiumHTML += `<div class="status"><b>ðŸ¥ˆ 2Âº LUGAR:</b> ${vice.name}</div>`; placed.add(vice.name); }
    if (third) { podiumHTML += `<div class="status"><b>ðŸ¥‰ 3Âº LUGAR:</b> ${third.name}</div>`; placed.add(third.name); }

    if (state._rankingSnapshot) {
      let rank = placed.size + 1;
      state._rankingSnapshot.forEach(r => { if (!placed.has(r.name)) { podiumHTML += `<div class="status"><b>${rank}Âº LUGAR:</b> ${r.name}</div>`; placed.add(r.name); rank++; } });
    }
    el("podiumBox").innerHTML = podiumHTML || '<div class="status">IndisponÃ­vel.</div>';
  }
